[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpulse-ai"
version = "0.1.0"
description = "Data engineering and analytics platform for exploring technology job-market trends."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sergio Nieto de la Morena" }
]
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
    "uvicorn[standard]>=0.30,<1",
    "requests>=2.34,<3",
    "pandas>=2.2,<4",
    "streamlit>=1.48,<2",
    
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest",
    "pytest-cov",
    "ruff",
    "matplotlib",
    "ipykernel",
    
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88